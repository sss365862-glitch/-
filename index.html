<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>それ消したら、世界バグった。</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 上部：タイトルと説明 -->
  <header class="top">
    <div>
      <h1>それ消したら、世界バグった。</h1>
      <p class="lead">世界から1つ、消せます。</p>
    </div>
    <!-- 右上：世界を戻す -->
    <button id="resetBtn" class="reset">世界を戻す</button>
  </header>

  <main>
    <!-- 状態表示（どの段階か） -->
    <p id="stageLabel" class="stage">いつもの世界</p>

    <!-- 中央：街カード4枚と矢印 -->
    <section id="town" class="town">
      <div class="card" data-place="cafe"><div class="inner"><span class="emoji">☕</span><span class="place">カフェ</span><p class="text"></p></div></div>
      <div class="arrow" data-i="0"><span class="mark">→</span><span class="reason"></span></div>
      <div class="card" data-place="station"><div class="inner"><span class="emoji">🚉</span><span class="place">駅</span><p class="text"></p></div></div>
      <div class="arrow" data-i="1"><span class="mark">→</span><span class="reason"></span></div>
      <div class="card" data-place="school"><div class="inner"><span class="emoji">🏫</span><span class="place">学校</span><p class="text"></p></div></div>
      <div class="arrow" data-i="2"><span class="mark">→</span><span class="reason"></span></div>
      <div class="card" data-place="home"><div class="inner"><span class="emoji">🏠</span><span class="place">家</span><p class="text"></p></div></div>
    </section>

    <!-- 生成中の表示 -->
    <div id="loading" class="loading hidden">
      <span class="spinner"></span>
      <span id="loadingText">AIが「消えた世界」を計算中…</span>
    </div>

    <!-- 意外な困り事 -->
    <p id="trouble" class="trouble hidden"></p>

    <!-- 結果表示部分：さらにその先・新聞・AI生成/サンプル表示 -->
    <section class="result">
      <button id="nextBtn" class="next hidden">さらにその先 ▶</button>
      <div id="paper" class="paper hidden">
        <div class="paper-name">世界バグ新聞</div>
        <div id="headline" class="headline"></div>
      </div>
      <p id="sourceBadge" class="badge hidden"></p>
    </section>

    <!-- 消して壊れた言葉（砕ける演出用） -->
    <div id="shatter" class="shatter"></div>
  </main>

  <!-- 下部：消すボタン3つ -->
  <footer class="erase">
    <button class="erase-btn" data-target="待ち時間">待ち時間を消す</button>
    <button class="erase-btn" data-target="締切">締切を消す</button>
    <button class="erase-btn" data-target="既読">既読を消す</button>
  </footer>

  <script src="scenarios.js"></script>
  <script src="script.js"></script>
</body>
</html>
